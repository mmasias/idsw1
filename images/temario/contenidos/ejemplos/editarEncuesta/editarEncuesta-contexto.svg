@startuml editarEncuesta-contexto

left to right direction
hide empty description


state ENCUESTAS_ABIERTO
state ENCUESTA_ABIERTO

[*] - -> ENCUESTAS_ABIERTO
ENCUESTAS_ABIERTO - -> ENCUESTA_ABIERTO : abrirEncuesta()\ncrearEncuesta()
ENCUESTA_ABIERTO - -> ENCUESTAS_ABIERTO : abrirEncuestas()
ENCUESTAS_ABIERTO - -> ENCUESTAS_ABIERTO : eliminarEncuesta()
ENCUESTA_ABIERTO - -> ENCUESTA_ABIERTO : <b>editarEncuesta()</b>\nemitirCodigos()\nlanzarEncuesta()\ncerrarEncuesta()\npublicarResultados()

@enduml

